<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="indBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12182b"/>
      <stop offset="60%" stop-color="#080c17"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="goldIndia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <filter id="indGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="30" fill="url(#indBg)" stroke="#ff9933" stroke-width="4"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#goldIndia)" stroke-width="2.5" stroke-dasharray="8 4"/>

  <!-- Tricolor & Fireworks Starburst -->
  <g transform="translate(200, 135)" filter="url(#indGlow)">
    <!-- Tricolor Ribbon/Wings -->
    <path d="M-50,0 C-30,-30 30,-30 50,0 C30,-15 -30,-15 -50,0 Z" fill="#ff9933"/>
    <path d="M-55,10 C-35,-15 35,-15 55,10 C35,0 -35,0 -55,10 Z" fill="#ffffff"/>
    <path d="M-50,20 C-30,0 30,0 50,20 C30,10 -30,10 -50,20 Z" fill="#138808"/>
    <!-- Central Ashoka Starburst -->
    <circle cx="0" cy="0" r="16" fill="#000088" stroke="#ffffff" stroke-width="2"/>
    <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,6 -7,10 -5,2 -11,-4 -3,-4" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="200" y="240" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="900" fill="url(#goldIndia)" text-anchor="middle" letter-spacing="4" filter="url(#indGlow)">SON INDIA</text>
  <text x="200" y="275" font-family="'Outfit', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6">FIREWORKS</text>

  <rect x="85" y="300" width="230" height="26" rx="13" fill="#0c152a" stroke="#ff9933" stroke-width="1.5"/>
  <text x="200" y="317" font-family="'Outfit', Arial, sans-serif" font-size="11" font-weight="600" fill="#ffd54f" text-anchor="middle" letter-spacing="2">PRIDE OF INDIAN FESTIVALS</text>
</svg>
