<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="velsBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d1200"/>
      <stop offset="60%" stop-color="#1f0700"/>
      <stop offset="100%" stop-color="#080200"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79"/>
      <stop offset="40%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="30" fill="url(#velsBg)" stroke="#ff9100" stroke-width="4"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#fireGrad)" stroke-width="2.5" stroke-dasharray="10 5"/>

  <!-- Vel (Sacred Spear) / Pyrotechnic Flame Motif -->
  <g transform="translate(200, 140)" filter="url(#flameGlow)">
    <!-- Vel Spear Blade -->
    <path d="M0,-55 C22,-25 24,15 12,30 L6,30 L6,55 L-6,55 L-6,30 L-12,30 C-24,15 -22,-25 0,-55 Z" fill="url(#fireGrad)" stroke="#fff" stroke-width="1.5"/>
    <circle cx="0" cy="-10" r="6" fill="#fff"/>
    <!-- Radiating Sparks -->
    <circle cx="-35" cy="-15" r="3" fill="#ffea79"/>
    <circle cx="35" cy="-15" r="3" fill="#ffea79"/>
    <circle cx="-25" cy="20" r="2.5" fill="#ff9100"/>
    <circle cx="25" cy="20" r="2.5" fill="#ff9100"/>
  </g>

  <!-- Typography -->
  <text x="200" y="240" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="900" fill="url(#fireGrad)" text-anchor="middle" letter-spacing="4" filter="url(#flameGlow)">VEL'S</text>
  <text x="200" y="275" font-family="'Outfit', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6">FIREWORKS</text>

  <rect x="90" y="300" width="220" height="26" rx="13" fill="#2d0a00" stroke="url(#fireGrad)" stroke-width="1.5"/>
  <text x="200" y="317" font-family="'Outfit', Arial, sans-serif" font-size="11" font-weight="600" fill="#ffea79" text-anchor="middle" letter-spacing="2">SIVAKASI MASTER CRAFT</text>
</svg>
